# cargo-deny: the licence gate for a repository that is MIT OR Apache-2.0 and must stay so.
# Only permissive licences are allowed, so AGPL, GPL and LGPL (and anything unlisted) fail the
# build. CertifiedCopy (AGPL) is launched by the host as a separate process, never linked.

[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are checked too: an AGPL workspace member is as fatal as an AGPL dependency.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
yanked = "deny"
